<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IDAC Digital</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna de leitura com cabeçalho de progresso fixo; cada afirmação é uma linha com escala de 5 passos. */
:root{
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  --bg:#F1F5F4;
  --surface:#FFFFFF;
  --surface-2:#E7EFEE;
  --fg:#0E2428;
  --muted:#52676B;
  --line:#D3DFDD;
  --accent:#0B6E78;
  --accent-ink:#FFFFFF;
  --accent-soft:#DAEDEF;
  --amber:#D98A12;
  --amber-soft:#FCEFD3;
  --danger:#B3261E;
  --danger-soft:#FBE6E3;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1A1D;--surface:#132528;--surface-2:#183035;--fg:#E6F0EF;--muted:#9AB2B4;--line:#27403F;
    --accent:#5CC8D3;--accent-ink:#06262A;--accent-soft:#16393E;--amber:#F2B24B;--amber-soft:#3A2C10;
    --danger:#FF9B92;--danger-soft:#3C1C1A;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1A1D;--surface:#132528;--surface-2:#183035;--fg:#E6F0EF;--muted:#9AB2B4;--line:#27403F;
  --accent:#5CC8D3;--accent-ink:#06262A;--accent-soft:#16393E;--amber:#F2B24B;--amber-soft:#3A2C10;
  --danger:#FF9B92;--danger-soft:#3C1C1A;color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);
  font:400 16px/1.55 var(--font-body);
  padding-block:0 3.5rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:760px;width:100%;margin-inline:auto}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);font-weight:600;letter-spacing:-.015em;text-wrap:balance;margin:0}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-top:.7rem}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding-bottom:.55rem}
.brand{display:flex;align-items:center;gap:.7rem;font:600 1.1rem var(--font-display);letter-spacing:.06em;background:none;border:0;color:var(--fg);padding:.1rem 0;cursor:pointer}
.brand img{height:40px;width:auto;display:block}
.brand b{color:var(--accent);font-weight:700}
.hero-logo{display:block;width:min(260px,66%);height:auto;margin:0 0 1.75rem}
.credit{margin-top:3.5rem;padding-top:1.1rem;border-top:1px solid var(--line);font-size:.86rem;color:var(--muted);display:flex;flex-direction:column;gap:.2rem}
.credit strong{color:var(--fg);font-weight:600}
.printhead{display:none}
.stepinfo{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
main{padding-top:1.75rem;outline:none}

/* textos */
.eyebrow{font-size:.78rem;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:.6rem}
h1{font-size:clamp(2rem,6.4vw,3.1rem);line-height:1.08}
h2{font-size:clamp(1.5rem,4.2vw,2rem);line-height:1.15}
h3{font-size:1.2rem;line-height:1.25}
.lead{font-size:1.1rem;color:var(--fg);max-width:60ch}
.sub{color:var(--muted);max-width:62ch}
.stack>*+*{margin-top:1rem}

/* botões */
.btn{font:600 1rem var(--font-body);min-height:48px;padding:0 1.4rem;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);filter:none}
.btn.danger{background:var(--danger);border-color:var(--danger);color:var(--bg)}
.actions{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:space-between;margin-top:2rem}
.actions.end{justify-content:flex-start}

/* boas-vindas */
.abbr{display:inline-block;font:700 .8rem var(--font-display);letter-spacing:.14em;color:var(--accent);background:var(--accent-soft);padding:.25rem .6rem;border-radius:6px;margin-bottom:1rem}
.ribbon{display:grid;grid-template-columns:repeat(5,1fr);gap:.4rem;margin:1.5rem 0 1.25rem}
.rb-c{border-radius:10px;padding:.6rem .5rem;border:1px solid var(--line);font-size:.78rem;line-height:1.25;display:flex;flex-direction:column;gap:.3rem;min-width:0;overflow-wrap:anywhere}
.rb-c b{font:600 1.3rem/1 var(--font-display)}
.t1{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.t2{background:color-mix(in srgb,var(--accent) 20%,var(--surface))}
.t3{background:color-mix(in srgb,var(--accent) 42%,var(--surface))}
.t4{background:color-mix(in srgb,var(--accent) 80%,var(--surface));color:var(--accent-ink)}
.t5{background:var(--accent);color:var(--accent-ink)}
.ribbon.compact{margin:1rem 0 .5rem}
.ribbon.compact .rb-c{padding:.4rem .4rem;font-size:.7rem}
.ribbon.compact .rb-c b{font-size:1rem}
.parts{list-style:none;margin:1.5rem 0 0;padding:0}
.parts li{display:grid;grid-template-columns:5.2rem minmax(0,1fr) auto;gap:.75rem;padding:.7rem 0;border-top:1px solid var(--line);align-items:baseline}
.parts li:last-child{border-bottom:1px solid var(--line)}
.parts .pt{font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.parts .ct{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:.88rem;color:var(--muted);margin-top:1rem;max-width:62ch}
.resume{background:var(--accent-soft);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;margin-bottom:2rem;display:flex;flex-direction:column;gap:.8rem}
.resume .row{display:flex;flex-wrap:wrap;gap:.6rem}

/* formulário */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.1rem 1rem;margin-top:1.5rem}
.fld{display:flex;flex-direction:column;gap:.35rem;min-width:0}
.fld.full{grid-column:1/-1}
@media(max-width:600px){.form{grid-template-columns:minmax(0,1fr)}}
.fld label{font-weight:600;font-size:.92rem}
.req{font-weight:500;font-size:.75rem;color:var(--muted);margin-left:.3rem}
input[type=text],input[type=number],input[type=date],select,textarea{
  font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;
  min-height:46px;padding:.55rem .8rem;width:100%;
}
textarea{min-height:104px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.fld.bad input,.fld.bad select{border-color:var(--danger)}
.ferr{color:var(--danger);font-size:.85rem}

/* afirmações */
.blk{margin-top:2.25rem;padding-bottom:.25rem}
.blk:first-of-type{margin-top:1.5rem}
.items{list-style:none;margin:.6rem 0 0;padding:0}
.item{display:grid;grid-template-columns:minmax(0,1fr);gap:.6rem 1.5rem;padding:1rem .5rem 1rem 0;border-top:1px solid var(--line);scroll-margin-top:6rem}
.item:last-child{border-bottom:1px solid var(--line)}
.item.missing{background:var(--danger-soft);box-shadow:inset 3px 0 0 var(--danger);padding-left:.75rem}
@media(min-width:720px){.item{grid-template-columns:minmax(0,1fr) 296px;align-items:start}}
.q{display:flex;gap:.75rem;min-width:0}
.qn{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;padding-top:.18rem;min-width:1.6rem}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.4rem;position:relative}
.rb{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.pill{display:flex;align-items:center;justify-content:center;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums;transition:background .12s,border-color .12s}
.pill:hover{background:var(--accent-soft);border-color:var(--accent)}
.rb:checked+.pill{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rb:focus-visible+.pill{outline:2px solid var(--accent);outline-offset:2px}
.picked{font-size:.82rem;color:var(--muted);min-height:1.3em;margin-top:.35rem}
.counter{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:.5rem}
.warn{margin-top:1.25rem;padding:.8rem 1rem;border-radius:10px;background:var(--danger-soft);color:var(--fg);border:1px solid var(--danger);font-weight:500}
.refl{display:flex;flex-direction:column;gap:1.4rem;margin-top:1.5rem}

/* resultados */
.sec{margin-top:2.75rem}
.sec>h3{margin-bottom:.35rem}
.meta{color:var(--muted);margin-top:.5rem}
.bars{display:flex;flex-direction:column;gap:1.15rem;margin-top:1.25rem}
.bar-head{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;margin-bottom:.4rem}
.bn{font-weight:600;min-width:0}
.bv{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.bar-track{position:relative;height:12px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar-track i.hl{background:var(--amber)}
.bar-track::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line)}
.bar-foot{font-size:.85rem;color:var(--muted);margin-top:.3rem;font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:.76rem;font-weight:600;padding:.15rem .6rem;border-radius:99px;margin-left:.5rem;vertical-align:.1em}
.b-low{background:var(--surface-2);color:var(--muted)}
.b-mid{background:var(--accent-soft);color:var(--accent)}
.b-high{background:var(--accent);color:var(--accent-ink)}
.axis-note{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin-top:.5rem;font-variant-numeric:tabular-nums}
.topa{background:var(--amber-soft);border:1px solid var(--amber);border-radius:14px;padding:1.1rem 1.25rem;margin-top:.75rem}
.topa h4{font:600 1.35rem/1.2 var(--font-display);margin:0 0 .4rem}
.topa p+p{margin-top:.5rem}
.topa .nums{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rank-row{display:grid;grid-template-columns:1.6rem minmax(0,1fr);gap:.6rem;align-items:start}
.rank-n{font:600 1rem var(--font-display);color:var(--muted);padding-top:.05rem;font-variant-numeric:tabular-nums}
.radar{display:block;width:100%;max-width:560px;height:auto;margin:1.5rem auto 0}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.radar .axis{stroke:var(--line);stroke-width:1}
.radar .shape{fill:var(--accent);fill-opacity:.2;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.radar .dot{fill:var(--accent)}
.radar .lbl{fill:var(--fg);font:500 14px var(--font-body)}
.radar .rl{fill:var(--muted);font:400 11px var(--font-body)}
.qa{margin:1.25rem 0 0;display:flex;flex-direction:column;gap:1.25rem}
.qa dt{font-weight:600}
.qa dd{margin:.3rem 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.qa dd.empty{color:var(--muted);font-style:italic}
.fb{margin-top:1rem}
.fb textarea{min-height:130px;font-size:.85rem}
.tools{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.5rem}

@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{
  html:root:root{--bg:#fff;--surface:#fff;--surface-2:#eee;--fg:#000;--muted:#444;--line:#bbb;--accent:#0B6E78;--accent-ink:#fff;--accent-soft:#e6f2f3;--amber:#C27800;--amber-soft:#fdf3dd;color-scheme:light}
  .top,.noprint,body::before{display:none!important}
  .printhead{display:flex;align-items:center;gap:1rem;margin-bottom:1.5rem}
  .printhead img{height:64px;width:auto}
  .printhead p{font-size:.95rem;line-height:1.3}
  main{padding-top:0}
  .sec{break-inside:avoid}
}
</style>

<header class="top wrap">
  <div class="top-row">
    <button type="button" class="brand" id="brand" aria-label="Voltar ao início do IDAC, Espaço GT"><img id="hlogo" alt="" height="40"><span>ID<b>AC</b></span></button>
    <span class="stepinfo" id="stepinfo"></span>
  </div>
  <div class="track" aria-hidden="true"><i id="bar"></i></div>
</header>
<main id="app" class="wrap" tabindex="-1"></main>
<footer class="wrap credit">
  <p>Recurso desenvolvido pelo <strong>Neuropsicólogo Paulo Gomes</strong> · CRP 11/13235</p>
  <p>Espaço GT · Psicologia e Psicoterapia</p>
</footer>

/* ---------- cálculo ---------- */
function band(m){return m<2.5?['Em construção','b-low']:(m<3.75?['Intermediário','b-mid']:['Consolidado','b-high']);}
function group(nums){
  var vals=nums.map(function(n){return S.answers[n];}).filter(Boolean);
  var sum=vals.reduce(function(a,b){return a+b;},0);
  return {sum:sum,max:nums.length*5,n:vals.length,mean:vals.length?sum/vals.length:0};
}
function compute(){
  var dims=DIMS.map(function(d,i){var g=group(d.nums);g.nome=d.nome;g.band=band(g.mean);return g;});
  var anchors=ANCHORS.map(function(a,i){var g=group(a.nums);g.nome=a.nome;g.curto=a.curto;g.desc=a.desc;g.order=i;return g;});
  var ranked=anchors.slice().sort(function(a,b){return b.mean-a.mean||a.order-b.order;});
  var top=ranked.filter(function(a){return a.mean===ranked[0].mean;});
  var all=[];DIMS.forEach(function(d){all=all.concat(d.nums);});
  return {dims:dims,anchors:anchors,ranked:ranked,top:top,geral:group(all)};
}

function radar(anchors){
  var cx=260,cy=172,R=116,n=anchors.length,lh=15;
  function pt(i,r){var a=-Math.PI/2+i*2*Math.PI/n;return [cx+r*Math.cos(a),cy+r*Math.sin(a),a];}
  function rad(m){return R*(m-1)/4;}
  function f(v){return v.toFixed(1);}
  var s='<svg viewBox="0 0 520 350" class="radar" role="img" aria-label="Gráfico de radar com a média de cada âncora de carreira">';
  [2,3,4,5].forEach(function(v){
    s+='<polygon class="ring" points="'+anchors.map(function(_,i){var p=pt(i,rad(v));return f(p[0])+','+f(p[1]);}).join(' ')+'"/>';
  });
  anchors.forEach(function(_,i){var p=pt(i,R);s+='<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+f(p[0])+'" y2="'+f(p[1])+'"/>';});
  [2,3,4,5].forEach(function(v){s+='<text class="rl" x="'+(cx+4)+'" y="'+f(cy-rad(v)-3)+'">'+v+'</text>';});
  s+='<polygon class="shape" points="'+anchors.map(function(a,i){var p=pt(i,rad(a.mean||1));return f(p[0])+','+f(p[1]);}).join(' ')+'"/>';
  anchors.forEach(function(a,i){var p=pt(i,rad(a.mean||1));s+='<circle class="dot" cx="'+f(p[0])+'" cy="'+f(p[1])+'" r="4"/>';});
  anchors.forEach(function(a,i){
    var p=pt(i,R+14),x=p[0],y=p[1],co=Math.cos(p[2]),si=Math.sin(p[2]);
    var ta=Math.abs(co)<0.2?'middle':(co>0?'start':'end');
    var y0=si<-0.5?y-(a.curto.length-1)*lh:(Math.abs(si)<=0.5?y-(a.curto.length-1)*lh/2+4:y+10);
    s+='<text class="lbl" text-anchor="'+ta+'" x="'+f(x)+'" y="'+f(y0)+'">'+a.curto.map(function(l,k){return '<tspan x="'+f(x)+'" dy="'+(k?lh:0)+'">'+esc(l)+'</tspan>';}).join('')+'</text>';
  });
  return s+'</svg>';
}

function topBlock(c){
  if(c.top.length===ANCHORS.length){
    return '<div class="topa"><p><strong>Sem âncora predominante.</strong> Todas as âncoras obtiveram a mesma média ('+fmt(c.top[0].mean)+').</p></div>';
  }
  var multi=c.top.length>1;
  var cards=c.top.map(function(a){
    return '<article class="topa"><h4>'+esc(a.nome)+'</h4><p>'+esc(a.desc)+'</p><p class="nums">Média '+fmt(a.mean)+' de 5 · '+a.sum+' de '+a.max+' pontos</p></article>';
  }).join('');
  var next=c.ranked[c.top.length];
  var nextG=c.ranked.filter(function(a){return a.mean===next.mean;});
  var nextTxt='<p class="note" style="margin-top:.75rem">Em seguida: '+nextG.map(function(a){return esc(a.nome);}).join(' e ')+' (média '+fmt(next.mean)+').</p>';
  return '<p class="sub">'+(multi?'Houve empate entre as âncoras de maior média.':'Âncora com a maior média entre as oito.')+'</p>'+cards+nextTxt;
}

function flash(btn,msg){var o=btn.textContent;btn.textContent=msg;setTimeout(function(){btn.textContent=o;},2000);}
function copy(text,btn){
  var fallback=function(){
    var fb=document.getElementById('fb'),ta=document.getElementById('fbtext');
    if(!fb||!ta)return;
    ta.value=text;fb.hidden=false;ta.focus();ta.select();
  };
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){flash(btn,'Copiado');},fallback);
    }else{fallback();}
  }catch(e){fallback();}
}

/* ---------- navegação ---------- */
function render(){
  var st=STEPS[S.step],h='';
  if(st.k==='welcome')h=welcome();
  else if(st.k==='ident')h=ident();
  else if(st.k==='dim')h=dimStep(st);
  else if(st.k==='anc')h=ancStep(st);
  else if(st.k==='refl')h=reflStep();
  else h=results();
  app.innerHTML=h;
  chrome();updateCounter();
}
function chrome(){
  var s=S.step;
  if(s===0){infoEl.textContent='';barEl.style.width='0';}
  else if(s<=INPUT_STEPS){infoEl.textContent='Etapa '+s+' de '+INPUT_STEPS;barEl.style.width=((s-1)/INPUT_STEPS*100)+'%';}
  else{infoEl.textContent='Resultado';barEl.style.width='100%';}
}
function updateCounter(){
  var el=document.getElementById('counter');if(!el)return;
  var nums=stepNums(STEPS[S.step]);
  var done=nums.filter(function(n){return S.answers[n];}).length;
  el.textContent='Respondidas nesta etapa: '+done+' de '+nums.length+' · Total: '+answeredCount()+' de '+TOTAL;
}
function go(i){
  S.step=i;if(i>0)S.last=i;save();render();
  window.scrollTo(0,0);
  var t=document.getElementById('stepTitle');if(t)t.focus({preventScroll:true});
}
function showWarn(msg){var w=document.getElementById('warn');if(w){w.textContent=msg;w.hidden=false;}}
function validate(st){
  if(st.k==='ident'){
    var ok=true,first=null;
    var chk=function(id,key,msg,test){
      var w=document.getElementById('w-'+id),e=document.getElementById('err-'+id),bad=!test(S.ident[key]);
      w.classList.toggle('bad',bad);e.hidden=!bad;e.textContent=bad?msg:'';
      if(bad){ok=false;if(!first)first=id;}
    };
    chk('f-nome','nome','Informe o nome.',function(v){return String(v).trim().length>0;});
    chk('f-idade','idade','Informe a idade em anos.',function(v){var n=+v;return v!==''&&n>=1&&n<=120;});
    if(!ok){document.getElementById(first).focus();}
    return ok;
  }
  if(st.k==='dim'||st.k==='anc'){
    var miss=stepNums(st).filter(function(n){return !S.answers[n];});
    stepNums(st).forEach(function(n){document.getElementById('item-'+n).classList.toggle('missing',!S.answers[n]);});
    if(miss.length){
      showWarn(miss.length===1?'Falta 1 afirmação nesta etapa. Ela está destacada abaixo.':'Faltam '+miss.length+' afirmações nesta etapa. Elas estão destacadas abaixo.');
      document.getElementById('item-'+miss[0]).scrollIntoView({block:'center'});
      return false;
    }
  }
  return true;
}

/* ---------- eventos ---------- */
app.addEventListener('change',function(e){
  var t=e.target;
  if(t.classList&&t.classList.contains('rb')){
    var n=+t.name.slice(1);
    S.answers[n]=+t.value;save();
    document.getElementById('item-'+n).classList.remove('missing');
    document.getElementById('pk'+n).textContent=t.value+' · '+LABELS[t.value];
    updateCounter();
    var w=document.getElementById('warn');
    if(w&&!w.hidden&&!document.querySelector('.item.missing'))w.hidden=true;
  }
});
app.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f){
    S.ident[t.dataset.f]=t.value;
    var w=document.getElementById('w-'+t.id);
    if(w&&w.classList.contains('bad')){w.classList.remove('bad');document.getElementById('err-'+t.id).hidden=true;}
  }else if(t.dataset&&t.dataset.r!==undefined){S.refl[t.dataset.r]=t.value;}
  else if(t.id==='obs'){S.obs=t.value;}
  else return;
  save();
});
var newTimer=null;
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='start')go(1);
  else if(a==='resume')go(resumeTo>0?resumeTo:1);
  else if(a==='fresh'){S=blank();resumeTo=1;save();go(1);}
  else if(a==='next'){if(validate(STEPS[S.step]))go(S.step+1);}
  else if(a==='prev')go(S.step-1);
  else if(a==='review')go(1);
  else if(a==='copysum')copy(summaryText(),b);
  else if(a==='copyjson')copy(jsonText(),b);
  else if(a==='print')window.print();
  else if(a==='dl'){
    var blob=new Blob([jsonText()],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');
    l.href=u;l.download='idac-resultado.json';document.body.appendChild(l);l.click();l.remove();setTimeout(function(){URL.revokeObjectURL(u);},1000);
  }
  else if(a==='new'){
    if(b.dataset.armed){clearTimeout(newTimer);S=blank();resumeTo=1;save();go(0);}
    else{
      b.dataset.armed='1';b.textContent='Confirmar: apagar todas as respostas';b.classList.remove('ghost');b.classList.add('danger');
      newTimer=setTimeout(function(){delete b.dataset.armed;b.textContent='Nova aplicação';b.classList.remove('danger');b.classList.add('ghost');},5000);
    }
  }
});
document.getElementById('brand').addEventListener('click',function(){if(S.step!==0)go(0);});
document.getElementById('hlogo').src=LOGO;

render();
})();
</script>

</body></html>
